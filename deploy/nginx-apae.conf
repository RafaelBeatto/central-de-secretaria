# Central da Secretaria APAE — acesso pelo IP na porta 8090 (até o DNS/HTTPS entrar).
# Front estático em /opt/apae/front; /api e /ws vão para o back em 127.0.0.1:8082.
server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    root /opt/apae/front;
    index index.html;

    # Uploads: o back aceita até 30 MB por requisição
    client_max_body_size 30m;

    location /api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Arquivos com hash no nome: cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: qualquer rota do React cai no index.html (sem cache, para pegar versão nova)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
