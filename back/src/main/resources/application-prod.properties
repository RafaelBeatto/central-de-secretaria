# =====================================================================
# Central da Secretaria — PRODUÇÃO (servidor BrasilCloud)
# Ativado com SPRING_PROFILES_ACTIVE=prod; só sobrescreve o application.properties.
# Senha do banco, segredo do JWT e chaves da AWS ficam em /etc/apae/apae.env (chmod 600),
# nunca aqui: o jar não pode levar segredo.
# =====================================================================

# Só o nginx (porta 8090 / apae.chorobura.com.br) fala com o back
server.address=127.0.0.1
server.port=8082
server.forward-headers-strategy=native

# Banco e usuário próprios do APAE (nunca os do System Car)
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/apae
spring.datasource.username=${APAE_DB_USUARIO:apae}
spring.datasource.password=${APAE_DB_SENHA}
# Servidor pequeno e compartilhado: poucas conexões e poucas threads
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
server.tomcat.threads.max=40

aplicacao.jwt.segredo=${APAE_JWT_SEGREDO}

# Endereços públicos do front (acesso pelo IP enquanto o DNS/HTTPS não entra)
aplicacao.cors.origens-permitidas=http://177.131.140.222:8090,https://apae.chorobura.com.br

# AWS S3
aplicacao.armazenamento.bucket=${APAE_S3_BUCKET:apae-chorobura}
aplicacao.armazenamento.regiao=${APAE_S3_REGIAO:sa-east-1}
aplicacao.armazenamento.endpoint=
aplicacao.armazenamento.chave-acesso=${AWS_ACCESS_KEY_ID:}
aplicacao.armazenamento.chave-secreta=${AWS_SECRET_ACCESS_KEY:}
