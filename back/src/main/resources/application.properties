# =====================================================================
# Central da Secretaria — ambiente LOCAL
# (application-prod.properties será criado no futuro)
# Valores sensíveis vêm de variáveis de ambiente; os padrões abaixo
# servem só para desenvolvimento na máquina local.
# =====================================================================
# Variáveis locais em back/.env (não versionado; modelo em .env.exemplo)
spring.config.import=optional:file:.env[.properties]

spring.application.name=central-secretaria
server.port=8080
spring.web.error.include-message=never

# Banco local "apae" (schema criado por src/main/resources/db/apae.sql)
spring.datasource.url=jdbc:postgresql://localhost:5432/apae
spring.datasource.username=${APAE_DB_USUARIO:postgres}
spring.datasource.password=${APAE_DB_SENHA:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Campos booleanos ausentes no JSON valem false (padrão do Jackson 2; o Jackson 3 recusa)
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Uploads (o limite fino por arquivo é validado em ServicoArquivo)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# Cache das permissões efetivas de cada usuário
spring.cache.cache-names=usuarios-autenticados
spring.cache.caffeine.spec=maximumSize=2000,expireAfterWrite=10m

# JWT: segredo com no mínimo 32 caracteres (HS256)
aplicacao.jwt.segredo=${APAE_JWT_SEGREDO:troque-este-segredo-local-com-32-caracteres-ou-mais}
aplicacao.jwt.validade-acesso-minutos=50
aplicacao.jwt.validade-renovacao-dias=1

# Fuso usado quando o navegador não informa o dele (cabeçalho X-Fuso-Horario)
aplicacao.fuso-horario-padrao=America/Sao_Paulo

# Front em desenvolvimento (Vite)
aplicacao.cors.origens-permitidas=http://localhost:5173

# AWS S3 — chaves do usuário IAM vindas do .env; se ficarem vazias,
# vale a cadeia padrão da AWS (perfil ~/.aws ou papel da máquina).
# "endpoint" só é usado para S3 compatível local (ex.: MinIO); deixe vazio na AWS.
aplicacao.armazenamento.bucket=${APAE_S3_BUCKET:apae-chorobura}
aplicacao.armazenamento.regiao=${APAE_S3_REGIAO:sa-east-1}
aplicacao.armazenamento.endpoint=${APAE_S3_ENDPOINT:}
aplicacao.armazenamento.chave-acesso=${AWS_ACCESS_KEY_ID:}
aplicacao.armazenamento.chave-secreta=${AWS_SECRET_ACCESS_KEY:}
aplicacao.armazenamento.tamanho-maximo-mb=20
aplicacao.armazenamento.validade-url-minutos=5
